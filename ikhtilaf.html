<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاشة الاختلاف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--maroon:#8B0045;--maroon-dark:#6B0035;--gold:#C9A84C;--gold-light:#E2C97E;--white:#fff}
body{font-family:'Tajawal',sans-serif;background:var(--maroon);min-height:100vh;color:var(--white)}
.topbar{background:var(--maroon-dark);border-bottom:2px solid var(--gold);padding:14px 30px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:20px;font-weight:800;color:var(--gold)}
.back-btn{background:rgba(201,168,76,0.15);border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:20px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s}
.back-btn:hover{background:var(--gold);color:var(--maroon-dark)}
.page{padding:24px 30px 80px}

.top-info{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:20px 24px;margin-bottom:20px}
.top-info h3{color:var(--gold);font-size:15px;font-weight:700;margin-bottom:14px}
.fields-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{color:var(--gold-light);font-size:13px;font-weight:600}
.field-group input,.field-group select{background:rgba(255,255,255,0.95);border:2px solid rgba(255,255,255,0.3);border-radius:8px;padding:9px 12px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;color:#333;direction:rtl;transition:border-color 0.2s}
.field-group input:focus,.field-group select:focus{outline:none;border-color:var(--gold)}
.ro{background:rgba(201,168,76,0.1)!important;border-color:rgba(201,168,76,0.3)!important;font-weight:800!important;text-align:center;cursor:default}

/* 3 column comparison */
.compare-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px}
.compare-col{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);border-radius:12px;overflow:hidden}
.col-header{padding:12px 16px;font-size:14px;font-weight:800;text-align:center;border-bottom:1px solid rgba(255,255,255,0.1)}
.col-header.istilam{background:rgba(34,197,94,0.15);color:#4ade80;border-bottom-color:rgba(34,197,94,0.2)}
.col-header.tadqeeq{background:rgba(59,130,246,0.15);color:#60a5fa;border-bottom-color:rgba(59,130,246,0.2)}
.col-header.mudeer{background:rgba(201,168,76,0.15);color:var(--gold);border-bottom-color:rgba(201,168,76,0.2)}

.compare-rows{padding:12px}
.denom-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.denom-row label{color:rgba(255,255,255,0.6);font-size:12px;font-weight:600}
.denom-row input{background:rgba(255,255,255,0.92);border:2px solid rgba(255,255,255,0.2);border-radius:6px;padding:7px 10px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:#333;text-align:center;width:110px;direction:ltr;transition:all 0.2s}
.denom-row input:focus{outline:none;border-color:var(--gold)}
.denom-row input.ro{background:rgba(255,255,255,0.6);cursor:default;color:#555}

.col-total{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between}
.col-total label{color:var(--gold-light);font-size:13px;font-weight:700}
.col-total span{color:var(--gold);font-size:15px;font-weight:800}

/* Diff indicator */
.diff-badge{display:inline-block;padding:4px 14px;border-radius:12px;font-size:12px;font-weight:700;margin-top:4px}
.diff-ok{background:rgba(34,197,94,0.15);color:#4ade80;border:1px solid rgba(34,197,94,0.3)}
.diff-err{background:rgba(239,68,68,0.15);color:#f87171;border:1px solid rgba(239,68,68,0.3)}

.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--maroon-dark);border-top:2px solid var(--gold);padding:14px 30px;display:flex;align-items:center;justify-content:space-between}
.submit-btn{background:var(--gold);color:var(--maroon-dark);border:none;padding:12px 40px;border-radius:25px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 15px rgba(201,168,76,0.4)}
.submit-btn:hover{background:var(--gold-light);transform:translateY(-2px)}
.diff-alert{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px 16px;color:#f87171;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <h2>⚠️ شاشة الاختلاف — تدخل المدير</h2>
  <a href="index.html" class="back-btn">→ الرئيسية</a>
</div>
<div class="page">
  <div class="top-info">
    <h3>بيانات العملية</h3>
    <div class="fields-grid">
      <div class="field-group">
        <label>اسم الموظف</label>
        <select><option value="">-- اختر --</option><option>أحمد محمد</option><option>علي حسن</option></select>
      </div>
      <div class="field-group">
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••">
      </div>
      <div class="field-group">
        <label>اختر رقم العملية</label>
        <select id="opSel" onchange="loadOp(this)">
          <option value="">-- اختر --</option>
        </select>
      </div>
      <div class="field-group">
        <label>اسم العميل</label>
        <input type="text" id="dClient" class="ro" readonly>
      </div>
      <div class="field-group">
        <label>التاريخ</label>
        <input type="datetime-local" id="dDate">
      </div>
      <div class="field-group">
        <label>نوع العملة</label>
        <input type="text" id="dCurr" class="ro" readonly value="دينار">
      </div>
      <div class="field-group">
        <label>نوع العملية</label>
        <input type="text" id="dType" class="ro" readonly>
      </div>
      <div class="field-group">
        <label>المبلغ الكلي</label>
        <input type="text" id="dTotal" class="ro" readonly value="0">
      </div>
    </div>
  </div>

  <div class="compare-grid">
    <!-- Column 1: Original Istilam -->
    <div class="compare-col">
      <div class="col-header istilam">الاستلام الأولى</div>
      <div class="compare-rows" id="col1Rows"></div>
      <div class="col-total">
        <label>المجموع</label>
        <span id="total1">0</span>
      </div>
    </div>
    <!-- Column 2: Tadqeeq -->
    <div class="compare-col">
      <div class="col-header tadqeeq">المدقق</div>
      <div class="compare-rows" id="col2Rows"></div>
      <div class="col-total">
        <label>المجموع</label>
        <span id="total2">0</span>
        <span class="diff-badge diff-err" id="diffBadge">اختلاف !</span>
      </div>
    </div>
    <!-- Column 3: Manager -->
    <div class="compare-col">
      <div class="col-header mudeer">المدير</div>
      <div class="compare-rows" id="col3Rows"></div>
      <div class="col-total">
        <label>المجموع</label>
        <span id="total3">0</span>
      </div>
    </div>
  </div>

  <div class="diff-alert" id="diffAlert">
    ⚠️ يوجد اختلاف بين المدقق والاستلام الأولى — يرجى مراجعة المدير
  </div>
</div>

<div class="bottom-bar">
  <div style="display:flex;align-items:center;gap:12px">
    <span style="color:var(--gold-light);font-size:13px;font-weight:600">قرار المدير:</span>
    <select style="background:rgba(255,255,255,0.95);border:2px solid rgba(255,255,255,0.3);border-radius:8px;padding:8px 14px;font-family:Tajawal,sans-serif;font-size:14px;color:#333;direction:rtl">
      <option>قبول قيمة المدقق</option>
      <option>قبول قيمة الاستلام الأولى</option>
      <option>تحديد قيمة جديدة</option>
    </select>
  </div>
  <button class="submit-btn" onclick="alert('✅ تم تثبيت قرار المدير بنجاح!')">تثبيت ✓</button>
</div>

<script>
const DENOMS=[50000,25000,10000,5000,1000,500,250];

function buildCol(id,editable){
  const div=document.getElementById(id);
  div.innerHTML='';
  DENOMS.forEach(d=>{
    const row=document.createElement('div');
    row.className='denom-row';
    row.innerHTML=`<label>${d.toLocaleString('ar-IQ')}</label>
      <input type="number" class="${editable?'':'ro'} ${id}-input" data-denom="${d}" value="0" min="0"
        ${editable?`oninput="calcTotal('${id}','total${id.slice(-1)}')"`:'readonly'}>`;
    div.appendChild(row);
  });
}

function calcTotal(colId,totalId){
  let t=0;
  document.querySelectorAll('.'+colId+'-input').forEach(i=>t+=parseInt(i.dataset.denom)*(parseInt(i.value)||0));
  document.getElementById(totalId).textContent=t.toLocaleString('ar-IQ');
  checkDiff();
}

function checkDiff(){
  const t1=parseInt(document.getElementById('total1').textContent.replace(/,/g,''))||0;
  const t2=parseInt(document.getElementById('total2').textContent.replace(/,/g,''))||0;
  const badge=document.getElementById('diffBadge');
  const alert2=document.getElementById('diffAlert');
  if(t1===t2){
    badge.className='diff-badge diff-ok';badge.textContent='متطابق ✓';
    alert2.style.display='none';
  } else {
    badge.className='diff-badge diff-err';badge.textContent='اختلاف !';
    alert2.style.display='block';
  }
}

buildCol('col1Rows',false);
buildCol('col2Rows',false);
buildCol('col3Rows',true);

// Load ops
const records=JSON.parse(localStorage.getItem('istilamRecords')||'[]');
const sel=document.getElementById('opSel');
records.forEach(r=>{
  const opt=document.createElement('option');
  opt.value=r.id;opt.textContent=r.id+' - '+r.client;
  sel.appendChild(opt);
});

function loadOp(sel){
  const r=records.find(x=>x.id==sel.value);
  if(!r)return;
  document.getElementById('dClient').value=r.client||'-';
  document.getElementById('dTotal').value=r.total||'0';
  document.getElementById('dCurr').value=r.currency||'دينار';
  document.getElementById('dType').value='استلام';
  // Populate col1 from record
  if(r.denoms){
    Object.entries(r.denoms).forEach(([d,v])=>{
      const inp=document.querySelector(`.col1Rows-input[data-denom="${d}"]`);
      if(inp)inp.value=v;
    });
  }
}
const now=new Date();
document.getElementById('dDate').value=now.toISOString().slice(0,16);
</script>
</body>
</html>
