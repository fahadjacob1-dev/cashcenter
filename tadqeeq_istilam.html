<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تدقيق الاستلام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background-color: #8b0045; 
    font-family: 'Tajawal', sans-serif; 
    color: white;
    height: 100vh;
    overflow: hidden; 
}

/* ---------------- Print Styles (A4 Receipt) ---------------- */
@media print {
    body > :not(#printArea) { display: none !important; }
    #printArea { display: block !important; width: 100%; color: #000; background: #fff; font-family: 'Tajawal', sans-serif; padding: 20px;}
    .print-header-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: center; font-weight: bold; margin-bottom: 20px; border: 1px solid #000; }
    .print-header-grid div { padding: 8px; border: 1px solid #ccc;}
    .print-title { text-align: center; font-size: 22px; font-weight: bold; margin: 20px 0; }
    .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; text-align: center; }
    .print-table th, .print-table td { border: 1px solid #000; padding: 8px; font-weight: bold;}
    .print-logo { color: #8b0045; font-size: 30px; font-weight: 900; margin-bottom: 10px; }
    .print-logo span { color: #555; font-size: 14px;}
}
/* -------------------------------------------------------- */

.topbar { background: #6b0035; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid #c9a84c; }
.back-btn { color: white; text-decoration: none; font-weight: bold; background: #c9a84c; color: #6b0035; padding: 5px 15px; border-radius: 5px;}

.main-container {
    display: flex;
    justify-content: space-around;
    padding: 30px;
}

/* Right Panel (Search & Info) */
.right-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 400px;
}
.form-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
}
.form-row label {
    font-weight: bold;
    font-size: 15px;
    width: 100px;
    text-align: right;
}
.form-row input, .form-row select {
    width: 250px;
    padding: 6px;
    border: none;
    font-size: 14px;
    font-weight: bold;
    text-align: center;
}
.search-btn {
    padding: 6px 15px;
    background: #ccc;
    border: none;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
}

/* Left Panel (Bags range) */
.left-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.bags-range {
    display: flex;
    align-items: center;
    gap: 15px;
    font-weight: bold;
}
.bags-range input {
    width: 60px;
    padding: 5px;
    text-align: center;
    border: none;
}

/* Middle Panel (Denominations) */
.mid-panel {
    margin-top: 30px;
    width: 600px;
    margin-left: auto;
    margin-right: auto;
}
.denom-header {
    display: flex;
    justify-content: space-between;
    background: #ccc;
    color: #000;
    padding: 8px 20px;
    font-weight: bold;
    margin-bottom: 10px;
}
.denom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 20px;
}
.denom-row input {
    width: 120px;
    padding: 6px;
    text-align: center;
    font-weight: bold;
    border: none;
}
.denom-row label {
    font-size: 16px;
    font-weight: bold;
    width: 100px;
    text-align: right;
}

.btn-audit {
    background: #fff;
    color: #000;
    font-weight: bold;
    font-size: 16px;
    padding: 8px 40px;
    border: none;
    cursor: pointer;
    display: block;
    margin: 20px auto;
}

/* Modal Popup (Image 4) */
.modal-overlay {
    position: fixed; top:0; left:0; right:0; bottom:0;
    background: rgba(0,0,0,0.5);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
}
.modal-content {
    background: #8b0045;
    border: 2px solid #ccc;
    padding: 20px;
    width: 450px;
    box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
}
.modal-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
.modal-top div { display: flex; align-items: center; gap: 10px; font-weight: bold;}
.modal-top input { width: 80px; text-align: center; padding: 5px; font-weight: bold; border: none;}
.modal-btn-next { background: #fff; padding: 5px 30px; font-weight: bold; border: none; cursor: pointer; float: left; margin-top: 15px;}

#printArea { display: none; }
</style>
</head>
<body>

<div class="topbar">
    <a href="index.html" class="back-btn">رجوع للرئيسية</a>
    <div>تدقيق الايداع</div>
</div>

<div class="main-container">
    <div class="left-panel">
        <div class="bags-range">
            <label>الاكياس<br>المطابقة</label>
            <label>من</label>
            <input type="number" id="bagFrom" value="1">
            <label>الى</label>
            <input type="number" id="bagTo" value="1">
        </div>
    </div>
    
    <div class="right-panel">
        <div class="form-row">
            <input type="text" id="empName">
            <label>اسم الموظف</label>
        </div>
        <div class="form-row">
            <input type="password" id="empPass">
            <label>كلمة المرور</label>
        </div>
        <div class="form-row" style="justify-content: flex-start; flex-direction: row-reverse;">
            <label>رقم الايداع</label>
            <input type="text" id="searchNum" style="width: 150px;">
            <button class="search-btn" onclick="searchOp()">🔍</button>
        </div>
        <div class="form-row">
            <input type="text" id="dispClient" readonly>
            <label>اسم العميل</label>
        </div>
        <div class="form-row">
            <input type="text" id="dispDate" readonly>
            <label>تاريخ الايداع</label>
        </div>
        <div class="form-row">
            <input type="text" id="dispCurrency" readonly>
            <label>نوع العملة</label>
        </div>
    </div>
</div>

<div class="mid-panel">
    <hr style="border:1px solid #ccc; margin-bottom: 20px;">
    <div class="denom-header">
        <div>قيمة الاوراق النقدية</div>
        <div>ادخل عدد الاوراق</div>
        <div>الفئة</div>
    </div>
    <div id="mainDenomsContainer"></div>
    <button class="btn-audit" onclick="openAuditModal()">تدقيق الاكياس (اضغط هنا)</button>
</div>

<!-- Modal -->
<div class="modal-overlay" id="auditModal">
    <div class="modal-content">
        <div style="background:#fff; color:#000; padding:2px 10px; margin:-20px -20px 20px -20px; font-weight:bold; font-size:14px;">تدقيق الايداع</div>
        
        <div class="modal-top">
            <div>
                <input type="text" id="mBagNum" readonly>
                <label>رقم الكيس :</label>
            </div>
            <div>
                <input type="text" id="mOpNum" readonly>
                <label>رقم العملية :</label>
            </div>
        </div>
        
        <div class="denom-header" style="background:#ccc; color:#000;">
            <div>ادخل عدد الاوراق</div>
            <div style="opacity:0">الفئة</div>
        </div>
        
        <div id="modalDenomsContainer"></div>
        
        <button class="modal-btn-next" id="btnNextModal" onclick="submitAuditBag()">التالي</button>
        <div style="clear:both;"></div>
    </div>
</div>

<!-- Print Area -->
<div id="printArea">
    <div class="print-logo">OFFTEC<br><span>I R A Q</span></div>
    <div class="print-title">إشعار استلام ايداع</div>
    
    <div class="print-header-grid">
        <div id="pDate">-</div>
        <div style="background:#eee;">التاريخ</div>
        
        <div id="pTime">-</div>
        <div style="background:#eee;">الوقت</div>
        
        <div id="pOpNum">-</div>
        <div style="background:#eee;">رقم العملية</div>
        
        <div id="pClient">-</div>
        <div style="background:#eee;">اسم العميل</div>
        
        <div id="pBags">-</div>
        <div style="background:#eee;">عدد أكياس الإيداع</div>
        
        <div id="pCurrency">-</div>
        <div style="background:#eee;">العملة</div>
    </div>
    
    <div style="text-align:center; font-weight:bold; margin-bottom:10px;">تفاصيل الايداع</div>
    
    <table class="print-table">
        <thead>
            <tr style="background:#eee;">
                <th>المبلغ</th>
                <th>العدد</th>
                <th>فئة النقد</th>
            </tr>
        </thead>
        <tbody id="pTableBody"></tbody>
        <tfoot>
            <tr style="font-weight:bold; background:#eee;">
                <td id="pTotalAmount">0</td>
                <td id="pTotalCount">0</td>
                <td>المجموع</td>
            </tr>
        </tfoot>
    </table>
</div>

<script>
let currentIstilamId = null;
let currentCurrency = 'دينار';
let totalBags = 0;
let currentBag = 1;
let currentOpNum = '';

const currencies = {
    'دينار': [50000, 25000, 10000, 5000, 1000, 500, 250],
    'دولار': [100, 50, 20, 10, 5, 2, 1],
    'يورو': [500, 200, 100, 50, 20, 10, 5]
};

// Build rows for main screen (readonly summary)
function buildMainRows() {
    const container = document.getElementById('mainDenomsContainer');
    container.innerHTML = '';
    const denoms = currencies[currentCurrency] || currencies['دينار'];
    denoms.forEach(d => {
        container.innerHTML += `
            <div class="denom-row" style="margin-bottom:10px;">
                <input type="text" value="0" readonly style="background:#ddd; color:#000;">
                <input type="number" value="0" disabled>
                <label>فئة ${d.toLocaleString('ar-IQ')}</label>
            </div>
        `;
    });
}
buildMainRows();

function searchOp() {
    const num = document.getElementById('searchNum').value.trim();
    if(!num) { alert('ادخل رقم العملية'); return; }
    
    fetch(`api_tadqeeq.php?action=get_istilam_info&op_num=${encodeURIComponent(num)}`)
    .then(r=>r.json())
    .then(data => {
        if(data.success) {
            const info = data.data;
            currentIstilamId = info.id;
            currentCurrency = info.currency;
            totalBags = parseInt(info.bags_count);
            currentOpNum = info.op_num;
            
            document.getElementById('dispClient').value = info.client_name;
            document.getElementById('dispDate').value = info.op_date;
            document.getElementById('dispCurrency').value = info.currency;
            document.getElementById('bagTo').value = totalBags;
            
            currentBag = 1;
            document.getElementById('bagFrom').value = currentBag;
            
            buildMainRows();
            openAuditModal();
        } else {
            alert('العملية غير موجودة أو تم تدقيقها مسبقاً');
        }
    }).catch(e => alert('خطأ اتصال'));
}

function openAuditModal() {
    if(!currentIstilamId) { alert('ابحث عن العملية اولاً'); return; }
    
    document.getElementById('mOpNum').value = currentOpNum;
    document.getElementById('mBagNum').value = currentBag;
    
    const denoms = currencies[currentCurrency] || currencies['دينار'];
    const container = document.getElementById('modalDenomsContainer');
    container.innerHTML = '';
    
    denoms.forEach(d => {
        container.innerHTML += `
            <div class="denom-row" style="padding:0 20px;">
                <input type="number" id="minp_${d}" value="0" min="0">
                <label style="width:100px;">فئة ${d.toLocaleString('ar-IQ')}</label>
            </div>
        `;
    });
    
    updateModalNextBtn();
    document.getElementById('auditModal').style.display = 'flex';
}

function updateModalNextBtn() {
    const btn = document.getElementById('btnNextModal');
    if(currentBag < totalBags) btn.textContent = 'التالي';
    else btn.textContent = 'إنهاء';
}

function submitAuditBag() {
    if(!currentIstilamId) { alert('ابحث عن العملية اولاً'); return; }

    const denoms = currencies[currentCurrency] || currencies['دينار'];
    const formData = new FormData();
    formData.append('action', 'save_istilam');
    formData.append('istilam_id', currentIstilamId);
    formData.append('bag_num', currentBag);
    
    let totalValue = 0;
    let totalCount = 0;
    
    denoms.forEach(d => {
        const count = parseInt(document.getElementById('minp_'+d).value) || 0;
        formData.append('d'+d, count);
        totalValue += (count * d);
        totalCount += count;
    });
    
    fetch('api_tadqeeq.php', { method: 'POST', body: formData })
    .then(r=>r.json())
    .then(data => {
        if(data.success) {
            if(data.data.match === 'match') {
                if(currentBag < totalBags) {
                    currentBag++;
                    document.getElementById('bagFrom').value = currentBag;
                    openAuditModal(); // re-init
                } else {
                    document.getElementById('auditModal').style.display = 'none';
                    printDepositReceipt(totalCount, totalValue, denoms);
                }
            } else {
                alert('⚠️ اختلاف بالقيم! تم تحويل العملية للمدير');
                document.getElementById('auditModal').style.display = 'none';
                setTimeout(() => { window.location.reload(); }, 2000);
            }
        } else {
            alert('خطأ: ' + data.error);
        }
    }).catch(e => alert('خطأ بالاتصال'));
}

function printDepositReceipt(totalCount, totalValue, denoms) {
    const date = new Date();
    document.getElementById('pDate').textContent = date.toLocaleDateString('en-US');
    document.getElementById('pTime').textContent = date.toLocaleTimeString('en-US');
    document.getElementById('pOpNum').textContent = currentOpNum;
    document.getElementById('pClient').textContent = document.getElementById('dispClient').value;
    document.getElementById('pBags').textContent = totalBags;
    document.getElementById('pCurrency').textContent = currentCurrency;
    
    const tbody = document.getElementById('pTableBody');
    tbody.innerHTML = '';
    
    denoms.forEach(d => {
        const count = parseInt(document.getElementById('minp_'+d).value) || 0;
        const val = count * d;
        if(count > 0 || true) { // Displaying all rows or just non-zero? In screenshot all rows show.
            tbody.innerHTML += `
                <tr>
                    <td>${val.toLocaleString('ar-IQ')}</td>
                    <td>${count}</td>
                    <td>${d.toLocaleString('ar-IQ')}</td>
                </tr>
            `;
        }
    });
    
    document.getElementById('pTotalAmount').textContent = totalValue.toLocaleString('ar-IQ');
    document.getElementById('pTotalCount').textContent = totalCount;
    
    window.print();
}
</script>
</body>
</html>
