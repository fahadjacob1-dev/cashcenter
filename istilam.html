<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تهيئة الاكياس - الاستلام النقدي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--maroon:#8B0045;--maroon-dark:#6B0035;--gold:#C9A84C;--gold-light:#E2C97E;--white:#fff}
body{font-family:'Tajawal',sans-serif;background:var(--maroon);min-height:100vh;color:var(--white)}

.topbar{
  background:var(--maroon-dark);
  border-bottom:2px solid var(--gold);
  padding:14px 30px;
  display:flex;align-items:center;justify-content:space-between;
}
.topbar h2{font-size:20px;font-weight:800;color:var(--gold)}
.back-btn{
  background:rgba(201,168,76,0.15);
  border:1px solid var(--gold);
  color:var(--gold);
  padding:8px 20px;border-radius:20px;
  font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;
  cursor:pointer;text-decoration:none;
  transition:all 0.2s;
}
.back-btn:hover{background:var(--gold);color:var(--maroon-dark)}

.page{padding:24px 30px 80px}

/* Top info section */
.info-section{
  background:rgba(0,0,0,0.2);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  padding:20px 24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:24px;
}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{
  color:var(--gold-light);font-size:13px;font-weight:600;
  text-align:right;
}
.field-group input,
.field-group select{
  background:rgba(255,255,255,0.95);
  border:2px solid rgba(255,255,255,0.3);
  border-radius:8px;
  padding:9px 12px;
  font-family:'Tajawal',sans-serif;
  font-size:14px;font-weight:500;
  color:#333;
  direction:rtl;
  transition:border-color 0.2s;
}
.field-group input:focus,
.field-group select:focus{
  outline:none;
  border-color:var(--gold);
}
.field-group input[readonly]{background:rgba(255,255,255,0.7);cursor:default}

/* Divider */
.divider{
  height:2px;
  background:linear-gradient(to left, transparent, var(--gold), transparent);
  margin:0 0 24px;
  border-radius:2px;
}

/* Currency table */
.table-header{
  display:grid;
  grid-template-columns:120px 1fr 1fr;
  gap:8px;
  margin-bottom:10px;
  padding:0 8px;
}
.table-header span{
  background:rgba(0,0,0,0.25);
  border:1px solid rgba(201,168,76,0.3);
  color:var(--gold-light);
  font-size:13px;font-weight:700;
  padding:10px;
  border-radius:8px;
  text-align:center;
}

.currency-row{
  display:grid;
  grid-template-columns:120px 1fr 1fr;
  gap:8px;
  margin-bottom:8px;
  align-items:center;
}
.denom-label{
  background:rgba(201,168,76,0.12);
  border:1px solid rgba(201,168,76,0.25);
  color:var(--gold-light);
  font-size:14px;font-weight:700;
  padding:10px;border-radius:8px;
  text-align:center;
}
.currency-row input{
  background:rgba(255,255,255,0.95);
  border:2px solid rgba(255,255,255,0.2);
  border-radius:8px;
  padding:10px 12px;
  font-family:'Tajawal',sans-serif;
  font-size:15px;font-weight:700;
  color:#333;
  text-align:center;
  direction:ltr;
  transition:all 0.2s;
}
.currency-row input:focus{outline:none;border-color:var(--gold);background:#fff}
.currency-row input.value-cell{
  background:rgba(255,255,255,0.7);
  color:#555;
  cursor:default;
}

/* Bottom actions */
.bottom-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--maroon-dark);
  border-top:2px solid var(--gold);
  padding:14px 30px;
  display:flex;align-items:center;justify-content:space-between;
}
.total-display{
  display:flex;align-items:center;gap:16px;
}
.total-label{color:var(--gold-light);font-size:14px;font-weight:600}
.total-amount{
  color:var(--gold);
  font-size:24px;font-weight:800;
  letter-spacing:1px;
}
.submit-btn{
  background:var(--gold);
  color:var(--maroon-dark);
  border:none;
  padding:12px 40px;
  border-radius:25px;
  font-family:'Tajawal',sans-serif;
  font-size:16px;font-weight:800;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 15px rgba(201,168,76,0.4);
}
.submit-btn:hover{background:var(--gold-light);transform:translateY(-2px)}

.msg{
  position:fixed;top:80px;right:30px;
  background:#22c55e;color:#fff;
  padding:14px 24px;border-radius:12px;
  font-size:15px;font-weight:700;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
  display:none;z-index:999;
}
</style>
</head>
<body>

<div class="topbar">
  <h2>💵 تهيئة الاكياس — الاستلام النقدي</h2>
  <a href="index.html" class="back-btn">→ الرئيسية</a>
</div>

<div class="page">
  <!-- Info Fields -->
  <div class="info-section">
    <div class="field-group">
      <label>اسم الموظف</label>
      <select id="empName">
        <option value="">-- اختر --</option>
        <option>أحمد محمد</option>
        <option>علي حسن</option>
        <option>سارة خالد</option>
      </select>
    </div>
    <div class="field-group">
      <label>كلمة المرور</label>
      <input type="password" id="empPass" placeholder="••••••">
    </div>
    <div class="field-group">
      <label>اسم العميل</label>
      <select id="clientName">
        <option value="">-- اختر --</option>
        <option>البنك الأهلي</option>
        <option>المصرف العربي</option>
        <option>بنك بغداد</option>
      </select>
    </div>
    <div class="field-group">
      <label>تاريخ الإيداع</label>
      <input type="datetime-local" id="depDate">
    </div>
    <div class="field-group">
      <label>نوع العملة</label>
      <select id="currency">
        <option>دينار</option>
        <option>دولار</option>
        <option>يورو</option>
      </select>
    </div>
    <div class="field-group">
      <label>المبلغ الكلي</label>
      <input type="text" id="totalField" readonly value="0">
    </div>
    <div class="field-group">
      <label>السيولة</label>
      <input type="text" id="liquidity" placeholder="أدخل السيولة">
    </div>
    <div class="field-group">
      <label>عدد الاكياس</label>
      <input type="number" id="bagsCount" placeholder="0" min="0">
    </div>
    <div class="field-group">
      <label>&nbsp;</label>
      <button class="submit-btn" onclick="submitBags()" style="width:100%;justify-content:center;font-size:14px;padding:9px 20px">
        تهيئة الاكياس ✓
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Currency Table -->
  <div class="table-header">
    <span>الفئة</span>
    <span>أدخل عدد الأوراق</span>
    <span>قيمة الأوراق النقدية</span>
  </div>

  <div id="currencyRows"></div>
</div>

<div class="bottom-bar">
  <div class="total-display">
    <span class="total-label">المجموع الكلي:</span>
    <span class="total-amount" id="grandTotal">0</span>
    <span class="total-label" id="currencyLabel">دينار</span>
  </div>
  <button class="submit-btn" onclick="saveRecord()">
    تسجيل ＋
  </button>
</div>

<div class="msg" id="successMsg">✅ تم تسجيل العملية بنجاح!</div>

<script>
const DENOMS = [50000,25000,10000,5000,1000,500,250];
const rows = document.getElementById('currencyRows');

// Build rows
DENOMS.forEach(d=>{
  const row = document.createElement('div');
  row.className = 'currency-row';
  row.innerHTML = `
    <div class="denom-label">${d.toLocaleString('ar-IQ')}</div>
    <input type="number" class="count-input" data-denom="${d}" value="0" min="0"
           oninput="calcRow(this)">
    <input type="text" class="value-cell" id="val_${d}" value="0" readonly>
  `;
  rows.appendChild(row);
});

// Set default date
const now = new Date();
document.getElementById('depDate').value = now.toISOString().slice(0,16);

function calcRow(input){
  const denom = parseInt(input.dataset.denom);
  const count = parseInt(input.value)||0;
  const val = denom * count;
  document.getElementById('val_'+denom).value = val.toLocaleString('ar-IQ');
  calcTotal();
}

function calcTotal(){
  let total = 0;
  document.querySelectorAll('.count-input').forEach(inp=>{
    total += (parseInt(inp.dataset.denom))*(parseInt(inp.value)||0);
  });
  document.getElementById('grandTotal').textContent = total.toLocaleString('ar-IQ');
  document.getElementById('totalField').value = total.toLocaleString('ar-IQ');
}

document.getElementById('currency').addEventListener('change',function(){
  document.getElementById('currencyLabel').textContent = this.value;
});

function submitBags(){
  const bags = parseInt(document.getElementById('bagsCount').value)||0;
  if(bags<=0){alert('يرجى إدخال عدد الاكياس');return;}
  alert('✅ تم تهيئة '+bags+' اكياس بنجاح!');
}

function saveRecord(){
  const emp = document.getElementById('empName').value;
  if(!emp){alert('يرجى اختيار اسم الموظف');return;}

  const denoms = {};
  document.querySelectorAll('.count-input').forEach(inp=>{
    denoms['d'+inp.dataset.denom] = inp.value||0;
  });

  const total = document.getElementById('grandTotal').textContent.replace(/,/g,'');

  const formData = new FormData();
  formData.append('action','save');
  formData.append('emp_name', emp);
  formData.append('client_name', document.getElementById('clientName').value);
  formData.append('op_date', document.getElementById('depDate').value);
  formData.append('currency', document.getElementById('currency').value);
  formData.append('total_amount', total);
  formData.append('bags_count', document.getElementById('bagsCount').value||0);
  Object.entries(denoms).forEach(([k,v])=>formData.append(k,v));

  fetch('api_istilam.php', {method:'POST', body:formData})
    .then(r=>r.json())
    .then(data=>{
      if(data.success){
        const msg = document.getElementById('successMsg');
        msg.style.display='block';
        setTimeout(()=>msg.style.display='none', 3000);
        document.querySelectorAll('.count-input').forEach(inp=>{inp.value=0});
        document.querySelectorAll('.value-cell').forEach(inp=>{inp.value='0'});
        calcTotal();
      } else {
        alert('خطأ: '+data.message);
      }
    })
    .catch(()=>alert('تعذر الاتصال بالسيرفر'));
}
</script>
</body>
</html>
