<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكياس الاستلام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background-color: #8b0045; /* Maroon background from screenshot */
    font-family: 'Tajawal', sans-serif; 
    color: white;
    height: 100vh;
    overflow: hidden; /* Desktop-like app */
}

/* ---------------- Print Styles (Thermal) ---------------- */
@media print {
    body > :not(#printArea) { display: none !important; }
    #printArea { display: block !important; width: 100%; color: #000; background: #fff; font-family: monospace; }
    .label-page { page-break-after: always; padding: 10px; width: 300px; text-align: center; margin: 0 auto; }
    .logo-placeholder { font-weight: bold; font-size: 20px; border-bottom: 2px solid #000; margin-bottom: 10px; padding-bottom: 5px; color: #8b0045;}
    .label-row { display: flex; justify-content: space-between; border: 1px solid #000; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
    .label-row div { padding: 5px; flex: 1; }
    .label-row div:first-child { border-left: 1px solid #000; background: #f0f0f0;}
}
/* -------------------------------------------------------- */

/* Topbar */
.topbar { background: #6b0035; padding: 10px 20px; display: flex; justify-content: space-between; border-bottom: 2px solid #c9a84c; }
.back-btn { color: white; text-decoration: none; font-weight: bold; background: #c9a84c; color: #6b0035; padding: 5px 15px; border-radius: 5px;}

.main-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px;
    gap: 40px;
}

/* Right Panel (Main Form) */
.form-panel {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 450px;
}
.form-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 15px;
}
.form-row label {
    font-weight: bold;
    font-size: 16px;
    width: 120px;
    text-align: left;
}
.form-row input, .form-row select {
    width: 250px;
    padding: 8px;
    border: none;
    font-size: 15px;
    font-family: 'Tajawal', sans-serif;
    font-weight: bold;
}
.btn-prepare {
    background: #fff;
    color: #000;
    font-family: 'Tajawal', sans-serif;
    font-weight: bold;
    font-size: 16px;
    padding: 8px 30px;
    border: 1px solid #ccc;
    cursor: pointer;
    align-self: flex-end;
    margin-top: 10px;
    margin-right: 135px; /* align with inputs */
}

/* Left Panel (Modal/Bag Entry) */
.bag-panel {
    background-color: #8b0045;
    border: 2px solid #ccc;
    box-shadow: -5px 5px 15px rgba(0,0,0,0.5);
    width: 400px;
    padding: 20px;
    position: relative;
    display: none;
}
.bag-panel-header {
    background: #fff;
    color: #000;
    padding: 5px 10px;
    font-weight: bold;
    font-size: 14px;
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
}
.bag-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    margin-bottom: 20px;
    padding: 0 40px;
}
.bag-info-val {
    background: #ccc;
    color: #000;
    padding: 5px 15px;
    font-weight: bold;
    min-width: 60px;
    text-align: center;
}
.bag-info-label { font-weight: bold; font-size: 18px; }

.denoms-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
}
.denom-header {
    display: flex;
    justify-content: space-between;
    padding: 0 40px;
    font-weight: bold;
    font-size: 16px;
    background: #ccc;
    color: #000;
    margin-bottom: 10px;
}
.denom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
}
.denom-row input {
    width: 100px;
    padding: 6px;
    text-align: center;
    font-weight: bold;
    border: none;
}
.denom-row label {
    font-size: 18px;
    font-weight: bold;
}
.btn-next {
    background: #fff;
    color: #000;
    font-family: 'Tajawal', sans-serif;
    font-weight: bold;
    font-size: 16px;
    padding: 5px 30px;
    border: none;
    cursor: pointer;
    margin-top: 20px;
    float: left;
}

#printArea { display: none; }
</style>
</head>
<body>

<div class="topbar">
    <a href="index.html" class="back-btn">رجوع للرئيسية</a>
    <div>تهيئة الاكياس</div>
</div>

<div class="main-container">
    <!-- Modal (Left in screenshot) -->
    <div class="bag-panel" id="bagPanel">
        <div class="bag-panel-header">
            <span>أكياس الاستلام</span>
            <span style="cursor:pointer;" onclick="cancelBags()">X</span>
        </div>
        
        <div class="bag-info-row">
            <div class="bag-info-val" id="lblBagNum">1</div>
            <div class="bag-info-label">رقم الكيس</div>
        </div>
        <div class="bag-info-row">
            <div class="bag-info-val" id="lblOpNum">---</div>
            <div class="bag-info-label">رقم العملية</div>
        </div>

        <div class="denom-header">
            <div>ادخل عدد الاوراق</div>
            <div style="opacity:0;">الفئة</div>
        </div>
        
        <div class="denoms-container" id="denomsContainer">
            <!-- Rows generated dynamically -->
        </div>

        <button class="btn-next" id="btnNextBag" onclick="nextBag()">التالي</button>
    </div>

    <!-- Main Form (Right in screenshot) -->
    <div class="form-panel">
        <div class="form-row">
            <input type="text" id="empName" placeholder="اسم الموظف" autocomplete="new-password">
            <label>اسم الموظف</label>
        </div>
        <div class="form-row">
            <input type="password" id="empPass" placeholder="كلمة المرور" autocomplete="new-password">
            <label>كلمة المرور</label>
        </div>
        <div class="form-row">
            <select id="clientName">
                <option value="1">البنك الأهلي</option>
                <option value="2">مصرف بغداد</option>
                <option value="3">شركة أوفنك</option>
            </select>
            <label>اسم العميل</label>
        </div>
        <div class="form-row">
            <input type="datetime-local" id="depDate">
            <label>تاريخ الايداع</label>
        </div>
        <div class="form-row">
            <select id="currency" onchange="updateCurrency()">
                <option value="دينار">الدينار</option>
                <option value="دولار">الدولار</option>
                <option value="يورو">اليورو</option>
            </select>
            <label>نوع العملة</label>
        </div>
        <div class="form-row">
            <input type="text" id="grandTotal" value="0" readonly style="background:#ccc;">
            <label>المبلغ الكلي</label>
        </div>
        <div class="form-row">
            <input type="text" id="commission" value="">
            <label>العمولة</label>
        </div>
        <div class="form-row">
            <input type="number" id="bagsCount" value="" min="1">
            <label>عدد الاكياس</label>
        </div>
        
        <button class="btn-prepare" id="btnPrepare" onclick="startBags()">تسجيل</button>
    </div>
</div>

<!-- Print Area -->
<div id="printArea"></div>

<script>
let totalBags = 0;
let currentBag = 1;
let allBagsData = [];
let opNumGenerated = "---";

const currencies = {
    'دينار': [50000, 25000, 10000, 5000, 1000, 500, 250],
    'دولار': [100, 50, 20, 10, 5, 2, 1],
    'يورو': [500, 200, 100, 50, 20, 10, 5]
};

document.getElementById('depDate').value = new Date().toISOString().slice(0,16);

// Fetch real next operation number from DB
fetch('api_istilam.php?action=get_next_op_num')
    .then(r=>r.json())
    .then(data => {
        if(data.success) {
            opNumGenerated = data.data.next_op_num;
            document.getElementById('lblOpNum').textContent = opNumGenerated;
        }
    }).catch(e => console.log('تعذر جلب رقم العملية'));

function updateCurrency() {
    // Reset if currency changes
    allBagsData = [];
    currentBag = 1;
    document.getElementById('grandTotal').value = 0;
}

function buildBagUI() {
    const curr = document.getElementById('currency').value;
    const denoms = currencies[curr];
    const container = document.getElementById('denomsContainer');
    container.innerHTML = '';

    denoms.forEach(d => {
        const row = document.createElement('div');
        row.className = 'denom-row';
        row.innerHTML = `
            <input type="number" id="inp_${d}" data-denom="${d}" value="0" min="0" oninput="calcTotal()">
            <label>فئة ${d.toLocaleString('ar-IQ')}</label>
        `;
        container.appendChild(row);
    });
}

function calcTotal() {
    // We can update the grand total live, or just keep it simple
}

function startBags() {
    totalBags = parseInt(document.getElementById('bagsCount').value);
    if(totalBags < 1) { alert('حدد عدد الاكياس'); return; }
    
    // Disable main form inputs
    document.getElementById('clientName').disabled = true;
    document.getElementById('currency').disabled = true;
    document.getElementById('bagsCount').disabled = true;
    document.getElementById('btnPrepare').disabled = true;

    allBagsData = [];
    currentBag = 1;
    
    document.getElementById('lblOpNum').textContent = opNumGenerated; // We show a temp one or generate one from server later
    document.getElementById('lblBagNum').textContent = currentBag;
    
    buildBagUI();
    document.getElementById('bagPanel').style.display = 'block';
    updateNextButton();
}

function cancelBags() {
    document.getElementById('bagPanel').style.display = 'none';
    document.getElementById('clientName').disabled = false;
    document.getElementById('currency').disabled = false;
    document.getElementById('bagsCount').disabled = false;
    document.getElementById('btnPrepare').disabled = false;
}

function updateNextButton() {
    const btn = document.getElementById('btnNextBag');
    if (currentBag < totalBags) {
        btn.textContent = 'التالي';
    } else {
        btn.textContent = 'تسجيل';
    }
}

function getBagAmount() {
    let bagTotal = 0;
    const inputs = document.querySelectorAll('.denom-row input');
    inputs.forEach(inp => {
        bagTotal += parseInt(inp.dataset.denom) * (parseInt(inp.value)||0);
    });
    return bagTotal;
}

function nextBag() {
    const curr = document.getElementById('currency').value;
    const denoms = currencies[curr];
    
    let bagData = { bag_num: currentBag, total_amount: getBagAmount() };
    denoms.forEach(d => {
        bagData['d'+d] = parseInt(document.getElementById('inp_'+d).value) || 0;
    });
    allBagsData.push(bagData);

    // Update grand total display
    let grand = parseInt(document.getElementById('grandTotal').value.replace(/,/g, '')) || 0;
    grand += bagData.total_amount;
    document.getElementById('grandTotal').value = grand.toLocaleString('ar-IQ');

    if (currentBag < totalBags) {
        currentBag++;
        document.getElementById('lblBagNum').textContent = currentBag;
        buildBagUI(); // reset inputs for next bag
        updateNextButton();
    } else {
        saveOperation();
    }
}

function saveOperation() {
    const formData = new FormData();
    formData.append('action', 'save');
    formData.append('emp_id', 1); // hardcoded for demo, normally from login
    formData.append('client_id', document.getElementById('clientName').value);
    formData.append('op_date', document.getElementById('depDate').value);
    formData.append('currency', document.getElementById('currency').value);
    formData.append('bags_count', totalBags);
    formData.append('liquidity', 0);
    formData.append('bags_data', JSON.stringify(allBagsData));

    fetch('api_istilam.php', { method: 'POST', body: formData })
    .then(r=>r.json())
    .then(data => {
        if(data.success) {
            generateThermalLabels(data.data.op_num);
            window.print();
            setTimeout(() => { window.location.reload(); }, 2000);
        } else {
            alert('خطأ: ' + data.error);
        }
    }).catch(e => alert('خطأ بالاتصال'));
}

function generateThermalLabels(opNum) {
    const printArea = document.getElementById('printArea');
    printArea.innerHTML = '';
    
    const clientNameText = document.getElementById('clientName').options[document.getElementById('clientName').selectedIndex].text;
    const dateText = new Date().toLocaleString('en-GB'); // matching image DD/MM/YYYY hh:mm pm

    for(let i=1; i<=totalBags; i++) {
        const label = document.createElement('div');
        label.className = 'label-page';
        label.innerHTML = `
            <div class="logo-placeholder">OFFTEC<br><span style="font-size:10px;color:#000;">I R A Q</span></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:12px;">
                <span>${dateText.split(',')[0]}</span>
                <span>${dateText.split(',')[1]}</span>
            </div>
            
            <div class="label-row">
                <div>${opNum}</div>
                <div>رقم الايداع</div>
            </div>
            <div class="label-row">
                <div>${i}</div>
                <div>رقم الكيس</div>
            </div>
            <div class="label-row" style="margin-top:15px;">
                <div>${clientNameText}</div>
                <div>اسم العميل</div>
            </div>
            <div class="label-row">
                <div>${totalBags}</div>
                <div>عدد الاكياس في الايداع</div>
            </div>
        `;
        printArea.appendChild(label);
    }
}
</script>
<script src="auth_check.js"></script>
</body>
</html>
