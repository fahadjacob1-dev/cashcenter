<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السحب النقدي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--maroon:#8B0045;--maroon-dark:#6B0035;--gold:#C9A84C;--gold-light:#E2C97E;--white:#fff}
body{font-family:'Tajawal',sans-serif;background:var(--maroon);min-height:100vh;color:var(--white)}
.topbar{background:var(--maroon-dark);border-bottom:2px solid var(--gold);padding:14px 30px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:20px;font-weight:800;color:var(--gold)}
.back-btn{background:rgba(201,168,76,0.15);border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:20px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;transition:all 0.2s}
.back-btn:hover{background:var(--gold);color:var(--maroon-dark)}
.page{padding:24px 30px 80px;max-width:700px;margin:0 auto}
.card{background:rgba(0,0,0,0.2);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;margin-bottom:20px}
.card h3{color:var(--gold);font-size:16px;font-weight:700;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid rgba(201,168,76,0.2)}
.fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-group{display:flex;flex-direction:column;gap:6px}
.field-group label{color:var(--gold-light);font-size:13px;font-weight:600}
.field-group input,.field-group select{background:rgba(255,255,255,0.95);border:2px solid rgba(255,255,255,0.3);border-radius:8px;padding:9px 12px;font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;color:#333;direction:rtl;transition:border-color 0.2s}
.field-group input:focus,.field-group select:focus{outline:none;border-color:var(--gold)}
.total-field{background:rgba(201,168,76,0.1)!important;border-color:var(--gold)!important;color:var(--gold)!important;font-size:18px!important;font-weight:800!important;text-align:center}
.divider{height:2px;background:linear-gradient(to left,transparent,var(--gold),transparent);margin:0 0 20px;border-radius:2px}
.table-header{display:grid;grid-template-columns:1fr 1fr 100px;gap:8px;margin-bottom:8px}
.table-header span{background:rgba(0,0,0,0.25);border:1px solid rgba(201,168,76,0.3);color:var(--gold-light);font-size:13px;font-weight:700;padding:10px;border-radius:8px;text-align:center}
.currency-row{display:grid;grid-template-columns:1fr 1fr 100px;gap:8px;margin-bottom:8px;align-items:center}
.denom-label{background:rgba(201,168,76,0.12);border:1px solid rgba(201,168,76,0.25);color:var(--gold-light);font-size:14px;font-weight:700;padding:10px;border-radius:8px;text-align:center}
.currency-row input{background:rgba(255,255,255,0.95);border:2px solid rgba(255,255,255,0.2);border-radius:8px;padding:10px 12px;font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;color:#333;text-align:center;direction:ltr;transition:all 0.2s}
.currency-row input:focus{outline:none;border-color:var(--gold)}
.readonly-input{background:rgba(255,255,255,0.7)!important;cursor:default!important;color:#555!important}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:var(--maroon-dark);border-top:2px solid var(--gold);padding:14px 30px;display:flex;align-items:center;justify-content:space-between}
.total-display{display:flex;align-items:center;gap:16px}
.total-label{color:var(--gold-light);font-size:14px;font-weight:600}
.total-amount{color:var(--gold);font-size:24px;font-weight:800}
.submit-btn{background:var(--gold);color:var(--maroon-dark);border:none;padding:12px 40px;border-radius:25px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 15px rgba(201,168,76,0.4)}
.submit-btn:hover{background:var(--gold-light);transform:translateY(-2px)}
.msg{position:fixed;top:80px;right:30px;background:#22c55e;color:#fff;padding:14px 24px;border-radius:12px;font-size:15px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,0.3);display:none;z-index:999}
</style>
</head>
<body>
<div class="topbar">
  <h2>🏧 السحب النقدي</h2>
  <a href="index.html" class="back-btn">→ الرئيسية</a>
</div>
<div class="page">
  <div class="card">
    <h3>بيانات العملية</h3>
    <div class="fields-grid">
      <div class="field-group">
        <label>اسم الموظف</label>
        <select id="empName">
          <option value="">-- اختر --</option>
          <option value="1">المدير العام</option>
          <option value="2">أحمد محمد</option>
          <option value="3">علي حسن</option>
          <option value="4">سارة خالد</option>
        </select>
      </div>
      <div class="field-group">
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••">
      </div>
      <div class="field-group">
        <label>رقم العملية</label>
        <input type="text" id="opNum" readonly>
      </div>
      <div class="field-group">
        <label>اسم العميل</label>
        <select id="clientName">
          <option value="">-- اختر --</option>
          <option value="1">البنك الأهلي</option>
          <option value="2">المصرف العربي</option>
          <option value="3">بنك بغداد</option>
          <option value="4">مصرف الرشيد</option>
          <option value="5">مصرف الرافدين</option>
        </select>
      </div>
      <div class="field-group">
        <label>تاريخ التسلم</label>
        <input type="datetime-local" id="opDate">
      </div>
      <div class="field-group">
        <label>نوع العملة</label>
        <select id="currency">
          <option>دينار</option><option>دولار</option><option>يورو</option>
        </select>
      </div>
      <div class="field-group" style="grid-column:span 2">
        <label>المجموع الكلي</label>
        <input type="text" id="totalField" class="total-field" readonly value="0">
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="table-header">
    <span>الفئة</span>
    <span>أدخل عدد الأوراق</span>
    <span>القيمة</span>
  </div>
  <div id="currencyRows"></div>
</div>

<div class="bottom-bar">
  <div class="total-display">
    <span class="total-label">المجموع:</span>
    <span class="total-amount" id="grandTotal">0</span>
    <span class="total-label" id="currLabel">دينار</span>
  </div>
  <button class="submit-btn" onclick="saveRecord()">تسجيل ＋</button>
</div>
<div class="msg" id="successMsg">✅ تم تسجيل السحب بنجاح!</div>

<script>
const DENOMS=[50000,25000,10000,5000,1000,500,250];
const rows=document.getElementById('currencyRows');
DENOMS.forEach(d=>{
  const row=document.createElement('div');
  row.className='currency-row';
  row.innerHTML=`
    <div class="denom-label">${d.toLocaleString('ar-IQ')}</div>
    <input type="number" class="count-input" data-denom="${d}" value="0" min="0" oninput="calcRow(this)">
    <input type="text" class="readonly-input" id="val_${d}" value="0" readonly>
  `;
  rows.appendChild(row);
});
const now=new Date();
document.getElementById('opDate').value=now.toISOString().slice(0,16);
document.getElementById('opNum').value=Math.floor(1000+Math.random()*9000);
function calcRow(input){
  const val=parseInt(input.dataset.denom)*(parseInt(input.value)||0);
  document.getElementById('val_'+input.dataset.denom).value=val.toLocaleString('ar-IQ');
  calcTotal();
}
function calcTotal(){
  let total=0;
  document.querySelectorAll('.count-input').forEach(inp=>{
    total+=parseInt(inp.dataset.denom)*(parseInt(inp.value)||0);
  });
  document.getElementById('grandTotal').textContent=total.toLocaleString('ar-IQ');
  document.getElementById('totalField').value=total.toLocaleString('ar-IQ');
}
document.getElementById('currency').addEventListener('change',function(){
  document.getElementById('currLabel').textContent=this.value;
});
function saveRecord(){
  const emp=document.getElementById('empName').value;
  if(!emp){alert('يرجى اختيار اسم الموظف');return;}

  const total=document.getElementById('grandTotal').textContent.replace(/,/g,'');
  const formData=new FormData();
  formData.append('action','save');
  formData.append('op_num',document.getElementById('opNum').value);
  formData.append('emp_id',emp);
  formData.append('client_id',document.getElementById('clientName').value);
  formData.append('op_date',document.getElementById('opDate').value);
  formData.append('currency',document.getElementById('currency').value);
  formData.append('total_amount',total);
  document.querySelectorAll('.count-input').forEach(i=>formData.append('d'+i.dataset.denom,i.value||0));

  fetch('api_sahb.php',{method:'POST',body:formData})
    .then(r=>r.json())
    .then(data=>{
      if(data.success){
        const msg=document.getElementById('successMsg');
        msg.style.display='block';
        setTimeout(()=>msg.style.display='none',3000);
        document.querySelectorAll('.count-input').forEach(i=>i.value=0);
        document.querySelectorAll('.readonly-input').forEach(i=>i.value='0');
        calcTotal();
        document.getElementById('opNum').value=Math.floor(1000+Math.random()*9000);
      } else {
        alert('خطأ: ' + (data.error || data.message || 'حدث خطأ غير معروف'));
      }
    })
    .catch(()=>alert('تعذر الاتصال بالسيرفر'));
}
</script>
<script src="auth_check.js"></script>
</body>
</html>
